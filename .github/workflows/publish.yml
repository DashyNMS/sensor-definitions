name: Publish sensor definitions
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Catalogue version, for example 1.0.0'
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: publish-catalogue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Read pinned revision
        id: upstream
        run: echo "revision=$(python -c "import json; print(json.load(open('sources/librenms.json'))['revision'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: librenms/librenms
          ref: ${{ steps.upstream.outputs.revision }}
          path: .upstream
          sparse-checkout: |
            resources/definitions/os_discovery
            resources/definitions/os_detection
            includes/discovery/sensors/state
            LICENSE.txt
          sparse-checkout-cone-mode: false
      - name: Build catalogue
        env:
          CATALOGUE_VERSION: ${{ inputs.version }}
        run: python tools/catalogue.py build --upstream .upstream --version "$CATALOGUE_VERSION" --output artifacts/release
      - name: Publish immutable data and propose stable feed
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOGUE_VERSION: ${{ inputs.version }}
        run: python tools/publish.py --version "$CATALOGUE_VERSION" --data artifacts/release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: publication-report
          path: artifacts/release
          retention-days: 30
