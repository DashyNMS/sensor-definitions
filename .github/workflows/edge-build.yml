name: Edge build

# Every commit to main: the catalogue as an artifact called
# catalogue-<LibreNMS release>-edge.<build>. It never reaches a release or the
# live feed; its files keep the release's own version, the only kind readers accept.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    if: github.repository == 'DashyNMS/sensor-definitions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the version
        id: version
        run: echo "version=$(jq -r .release sources/librenms.json)-edge.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      name: catalogue-${{ needs.version.outputs.version }}
