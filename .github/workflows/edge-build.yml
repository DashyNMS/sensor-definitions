name: Edge build

# Every commit to main: <LibreNMS release>-edge.<build>. By hand to make another
# of the same commit, for example after a failed publish. It never reaches the
# live feed, and its files keep the LibreNMS release's own version, the only
# kind readers accept.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    if: github.repository == 'DashyNMS/sensor-definitions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Work out the version
        id: version
        run: python tools/build_version.py edge --notes artifacts/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: artifacts/notes.md
          if-no-files-found: error
          retention-days: 14

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      name: catalogue-${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalogue-${{ needs.version.outputs.version }}-ubuntu-latest
          path: catalogue
      # One archive: readers only use the live feed's tags, never these.
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          tar -czf "sensor-definitions-$VERSION.tar.gz" -C catalogue .
          gh release create "$TAG" "sensor-definitions-$VERSION.tar.gz" --target "$COMMIT" --title "$VERSION" --notes-file notes.md --prerelease --latest=false
