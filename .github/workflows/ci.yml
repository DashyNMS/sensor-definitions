name: CI

# Every pull request, and every edge build. "CI result" is the required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
    inputs:
      name:
        description: What to call the catalogue artifacts
        type: string
        default: catalogue

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  catalogue:
    name: Catalogue
    uses: ./.github/workflows/catalogue.yml
    with:
      name: ${{ inputs.name || 'catalogue' }}

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pending notes
        run: python3 tools/release_notes.py

  result:
    name: CI result
    if: always()
    needs: [catalogue, security, notes]
    runs-on: ubuntu-latest
    steps:
      # Only success counts: a job no runner ever took is neither a failure nor
      # cancelled here. The same gate as the other DashyNMS repositories.
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e --arg event "$GITHUB_EVENT_NAME" \
            'all(.[]; .result == "success" or (.result == "skipped" and $event != "pull_request"))' <<<"$RESULTS" >/dev/null
