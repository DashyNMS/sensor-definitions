# Everything is pinned (actions by commit, packages by version), so nothing
# moves unless Dependabot proposes it. Minor and patch updates are grouped;
# majors come one at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: build(deps)
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    commit-message:
      prefix: build(deps)
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      packages:
        update-types: [minor, patch]
